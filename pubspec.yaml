name: auvy
description: "A hobby flutter project made by an aspiring electrical enginner using vibe coding."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.8+2080

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.2.3
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  spotify: ^0.16.0
  package_info_plus: ^9.0.1 
  http: ^1.6.0
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.1
  webview_flutter: ^4.0.7
  open_filex: ^4.4.0
  path_provider: ^2.1.5
  # Declared explicitly even though it already arrived transitively. Two files
  # import it (database_service and audio_cache_manager, the latter for the
  # containment check guarding a recursive delete), and an undeclared import
  # keeps working right up until some other package stops depending on it.
  path: ^1.9.1
  # Same story: database_service.dart imports sqflite directly while it only
  # arrived as a transitive dependency. The local database holds the user's
  # library, so this must not be one `pub upgrade` away from failing to resolve.
  sqflite: ^2.4.2
  # Reads a .backup archive (a zip) — ours and the InnerTune-family format.
  archive: ^4.0.9
  shared_preferences: ^2.5.4
  share_plus: ^12.0.1
  crypto: ^3.0.3
  permission_handler: ^12.0.1
  # Microphone PCM streaming for Shazam-style song recognition (see
  # SongRecognitionService). Needs RECORD_AUDIO in AndroidManifest.
  record: ^6.2.1
  encrypt: ^5.0.3  
  flutter_web_auth_2: ^5.0.1
  google_sign_in: ^6.2.1 
  cached_network_image: ^3.3.0
  # Cloud backup/restore of user data (history, stats, intelligence, library)
  # keyed by the signed-in account, so a reinstall + same-account login restores
  # everything. Initialization is guarded — the app runs fine until a Firebase
  # project is configured (google-services.json + the google-services gradle
  # plugin); see CloudSyncService.
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  # App Check attests requests to Firebase so only the genuine app can read/write
  # Firestore (blocks scraping/abuse of user_backups). Client activation is SAFE
  # before you turn on enforcement in the console — see main.dart. 0.3.x is the
  # line compatible with firebase_core 3.x.
  firebase_app_check: ^0.3.1
  flutter_cache_manager: ^3.3.1
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.3.0
  metadata_god: ^1.1.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  # web_socket_channel removed 2026-08-24: its only consumer was the dead
  # SyncService (a WebSocket listen-together implementation superseded by the
  # Firestore one in listen_together_provider). Discord Rich Presence — the app's
  # only remaining WebSocket — uses dart:io's WebSocket directly, not this package.


  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    # .env is deliberately NOT bundled. As an asset it shipped inside the APK at
    # assets/flutter_assets/.env and could be read with unzip. The Last.fm key now
    # comes from a --dart-define at build time (see lastfm_service.dart); this file
    # stays local-only for development. Do not re-add it here.
    - assets/images/
    - assets/icons/
    # THE LICENCE TEXT SHIPS INSIDE THE APK, NOT JUST AS A LINK.
    #
    # GPL-3.0 §4 asks that whoever receives the program also receives a copy of
    # the licence. The About screen already links to the source repository,
    # which covers §6 (corresponding source) — but a link needs a network and a
    # repository that still exists, and neither is something a licence should
    # depend on. Registered with LicenseRegistry in main.dart, so the full text
    # appears at the top of the in-app licence page, offline, forever.
    - LICENSE
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
# DO NOT RUN `dart run flutter_launcher_icons` — the launcher icons are
# maintained BY HAND and this config no longer describes them.
#
# Two reasons. `image_path` below points at assets/icons/app_icon.png, which does
# not exist (the asset is app_icon.webp), so a run would fail or emit nothing.
# More importantly, the app ships SIX launcher variants (one per accent colour,
# swapped via the activity-alias entries in AndroidManifest) plus real adaptive
# icons in res/mipmap-anydpi-v26 with per-variant background colours and
# glyph-only foregrounds. This generator understands none of that and would
# overwrite ic_launcher.png with a single flat icon.
#
# To regenerate the adaptive layers from the legacy bitmaps, run
# tool/gen_adaptive_icons.ps1 (it re-derives the glyph and background per variant).
flutter_launcher_icons:
  android: "ic_launcher" # The name of the icon file on Android
  ios: false # Generate iOS icons
  image_path: "assets/icons/app_icon.png" # Ensure this file exists at this path!
  adaptive_icon_background: "#121212" # Your theme color
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21 # Required for newer versions of the package
  remove_alpha_ios: true # Removes transparency for iOS (required by Apple)